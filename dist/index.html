    <title>Meal Planner</title>
    <script>
      /* Theme vor dem ersten Rendern setzen — kein Aufblitzen im Dunkelmodus */
      (function () {
        try {
          var t = localStorage.getItem('mealplanner.theme');
          var dark =
            t === 'dark' ||
            ((t === null || t === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
